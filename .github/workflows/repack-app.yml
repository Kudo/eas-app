name: CI repack 

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

jobs:
  repack-android:
    runs-on: ubuntu-latest
    concurrency: fingerprint-${{ github.event_name != 'pull_request' && 'main' || github.run_id }}
    permissions:
      actions: write # Allow updating action caches
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - name: 🔨 Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: test
        shell: bash
        run: |
          ls /usr/local/lib/android/sdk/build-tools/36.0.0/dexdump
          wget https://github.com/expo/expo-go-releases/releases/download/Expo-Go-54.0.6/Expo-Go-54.0.6.apk
          unzip Expo-Go-54.0.6.apk
          /usr/local/lib/android/sdk/build-tools/36.0.0/dexdump classes.dex classes2.dex
